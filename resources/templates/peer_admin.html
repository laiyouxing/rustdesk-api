<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备管理 - RustDesk API</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
.header { background: #2c8cff; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
.header h1 { font-size: 20px; }
.header a { color: rgba(255,255,255,.85); text-decoration: none; font-size: 14px; }
.header a:hover { color: #fff; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 20px; }
.card-title { padding: 12px 16px; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 600; }
.card-body { padding: 16px; }
.btn { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-primary { background: #2c8cff; color: #fff; }
.btn-primary:hover { background: #1a7ae6; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.filter-bar .btn { text-decoration: none; display: inline-block; }
.filter-bar .btn.active { box-shadow: 0 0 0 2px rgba(44,140,255,.4); font-weight: 600; }
.btn-all { background: #e6f7ff; color: #1890ff; }
.btn-online { background: #e6f7e6; color: #52c41a; }
.btn-offline { background: #fff0f0; color: #ff4d4f; }
.btn-all:hover, .btn-online:hover, .btn-offline:hover { filter: brightness(.95); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
th { background: #fafafa; font-weight: 600; color: #666; white-space: nowrap; }
tr:hover td { background: #f8f9ff; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-on { background: #e6f7e6; color: #52c41a; }
.badge-off { background: #f5f5f5; color: #999; }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 14px; z-index: 999; display: none; }
.toast-success { background: #52c41a; }
.toast-error { background: #ff4d4f; }
.login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.login-box { background: #fff; border-radius: 12px; padding: 32px; width: 360px; }
.login-box h2 { margin-bottom: 20px; font-size: 18px; text-align: center; }
.login-box .form-group { margin-bottom: 16px; }
.login-box .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
.login-box .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
.login-box .btn { width: 100%; padding: 10px; font-size: 15px; }
.hidden { display: none; }
.empty { text-align: center; color: #999; padding: 40px; }
.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; }
.pagination .btn { min-width: 60px; }
.pagination .info { font-size: 13px; color: #666; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
@media (max-width: 768px) {
  .header { padding: 12px 16px; flex-wrap: wrap; }
  .header h1 { font-size: 17px; }
  .container { padding: 10px; }
  .card-body { padding: 10px 8px; }
  th, td { padding: 6px 8px; font-size: 12px; }
  .btn { min-height: 44px; padding: 10px 16px; font-size: 14px; }
  .btn-sm { min-height: 36px; padding: 6px 12px; font-size: 12px; }
  .login-box { width: 90vw; max-width: 360px; padding: 24px 20px; }
  .toast { left: 16px; right: 16px; top: 12px; text-align: center; }
  .filter-bar { gap: 4px; }
  .filter-bar .btn { min-height: 36px; padding: 6px 12px; }
  .pagination { flex-wrap: wrap; }
  .badge { padding: 3px 8px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="header">
  <h1>📱 设备管理</h1>
  <a href="/api/admin/dashboard/">返回状态面板</a>
</div>
<div id="toast" class="toast"></div>

<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h2>管理员登录</h2>
    <div class="form-group"><label>用户名</label><input id="loginUser" placeholder="admin"></div>
    <div class="form-group"><label>密码</label><input id="loginPass" type="password" placeholder="********"></div>
    <button class="btn btn-primary" onclick="login()">登 录</button>
  </div>
</div>

<div id="mainContent" class="container hidden">
  <div class="card">
    <div class="card-title">
      <div class="filter-bar">
        <span style="font-size:13px;color:#666;margin-right:4px;">筛选：</span>
        <a class="btn btn-all active" id="filterAll" href="/api/admin/peer/">全部</a>
        <a class="btn btn-online" id="filterOnline" href="/api/admin/peer/?status=online">在线</a>
        <a class="btn btn-offline" id="filterOffline" href="/api/admin/peer/?status=offline">离线</a>
        <span style="flex:1;"></span>
        <span id="pageInfo" style="font-size:13px;color:#666;"></span>
      </div>
    </div>
    <div class="card-body">
      <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>设备ID</th><th>主机名</th><th>用户</th><th>IP</th><th>版本</th><th>平台</th><th>状态</th><th>最后在线</th></tr></thead>
        <tbody id="peerBody"></tbody>
      </table>
      </div>
      <div id="emptyTip" class="empty hidden">暂无设备记录</div>
      <div class="pagination" id="pagination">
        <button class="btn btn-primary btn-sm" id="prevBtn" onclick="prevPage()">上一页</button>
        <span class="info" id="pageInfo2"></span>
        <button class="btn btn-primary btn-sm" id="nextBtn" onclick="nextPage()">下一页</button>
      </div>
    </div>
  </div>
</div>

<script>
let token = '';
let currentPage = 1;
const pageSize = 20;
let currentFilter = 'all';

// Read filter from URL on load
(function() {
  const params = new URLSearchParams(location.search);
  currentFilter = params.get('status') || 'all';
})();

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast toast-' + type;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['api-token'] = token;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { token = ''; document.getElementById('loginOverlay').classList.remove('hidden'); return null; }
  const data = await res.json();
  if (data.code !== 0) { toast(data.message || '请求失败', 'error'); return null; }
  return data;
}

async function login() {
  const username = document.getElementById('loginUser').value;
  const password = document.getElementById('loginPass').value;
  const data = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ username, password }) });
  if (data && data.data && data.data.token) {
    token = data.data.token;
    localStorage.setItem('token', token);
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    toast('登录成功', 'success');
    loadPeers();
  }
}

function getTimeAgo() {
  if (currentFilter === 'online') return -300;  // 负数=在线
  if (currentFilter === 'offline') return 300;  // 正数=离线
  return 0;  // 全部
}

async function loadPeers() {
  let url = '/api/admin/peer/list?page=' + currentPage + '&page_size=' + pageSize;
  const ta = getTimeAgo();
  if (ta !== 0) url += '&time_ago=' + ta;

  const data = await api(url);
  if (!data || !data.data) return;
  const list = data.data.list || [];
  const total = data.data.total || 0;
  const tbody = document.getElementById('peerBody');
  const empty = document.getElementById('emptyTip');
  tbody.innerHTML = '';
  if (list.length === 0) { empty.classList.remove('hidden'); document.getElementById('pagination').classList.add('hidden'); return; }
  empty.classList.add('hidden');
  document.getElementById('pagination').classList.remove('hidden');

  const nowSec = Math.floor(Date.now() / 1000);
  list.forEach(v => {
    const tr = document.createElement('tr');
    const isOnline = v.last_online_time > (nowSec - 300);
    const timeStr = v.last_online_time ? new Date(v.last_online_time * 1000).toLocaleString() : '从未在线';
    tr.innerHTML = `
      <td>${v.row_id || v.id || ''}</td>
      <td>${esc(v.uuid || '')}</td>
      <td><strong>${esc(v.hostname || '')}</strong></td>
      <td>${esc(v.username || '')}</td>
      <td>${esc(v.last_online_ip || '')}</td>
      <td>${esc(v.version || '')}</td>
      <td>${esc(v.platform || '')}</td>
      <td><span class="badge ${isOnline ? 'badge-on' : 'badge-off'}">${isOnline ? '在线' : '离线'}</span></td>
      <td style="font-size:12px;color:#999;">${timeStr}</td>
    `;
    tbody.appendChild(tr);
  });

  const totalPages = Math.ceil(total / pageSize) || 1;
  document.getElementById('pageInfo').textContent = '共 ' + total + ' 台设备';
  document.getElementById('pageInfo2').textContent = '第 ' + currentPage + '/' + totalPages + ' 页';
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages;

  // Update filter button active state
  document.getElementById('filterAll').className = 'btn btn-all' + (currentFilter === 'all' ? ' active' : '');
  document.getElementById('filterOnline').className = 'btn btn-online' + (currentFilter === 'online' ? ' active' : '');
  document.getElementById('filterOffline').className = 'btn btn-offline' + (currentFilter === 'offline' ? ' active' : '');
}

function prevPage() { if (currentPage > 1) { currentPage--; loadPeers(); } }
function nextPage() { currentPage++; loadPeers(); }

function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

(async function() {
  const savedToken = localStorage.getItem('token');
  if (savedToken) {
    token = savedToken;
    const d = await api('/api/admin/user/current');
    if (d && d.data) {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      loadPeers();
      return;
    }
    token = '';
    localStorage.removeItem('token');
  }
  document.getElementById('loginOverlay').classList.remove('hidden');
})();
</script>
</body>
</html>
