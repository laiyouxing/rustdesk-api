<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>状态面板 - RustDesk API</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
.header { background: #2c8cff; color: #fff; padding: 16px 24px; }
.header h1 { font-size: 20px; }
.container { max-width: 960px; margin: 0 auto; padding: 20px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 20px; }
.card-title { padding: 12px 16px; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 600; }
.card-body { padding: 16px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.stat-card { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: box-shadow .2s, transform .2s; }
.stat-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); transform: translateY(-2px); }
.stat-card .number { font-size: 36px; font-weight: 700; margin-bottom: 4px; }
.stat-card .label { font-size: 14px; color: #999; }
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover { box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.stat-card .online { color: #52c41a; }
.stat-card .offline { color: #ff4d4f; }
.stat-card .total { color: #2c8cff; }
.stat-card .info { color: #666; }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 14px; z-index: 999; display: none; }
.toast-success { background: #52c41a; }
.toast-error { background: #ff4d4f; }
.login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.login-box { background: #fff; border-radius: 12px; padding: 32px; width: 360px; }
.login-box h2 { margin-bottom: 20px; font-size: 18px; text-align: center; }
.login-box .form-group { margin-bottom: 16px; }
.login-box .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
.login-box .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
.login-box .btn { width: 100%; padding: 10px; font-size: 15px; }
.hidden { display: none; }
.nav { margin-top: 12px; }
.nav a { color: rgba(255,255,255,.85); text-decoration: none; font-size: 14px; margin-right: 16px; }
.nav a:hover { color: #fff; }
</style>
</head>
<body>
<div class="header">
  <h1>📊 状态面板</h1>
  <div class="nav">
    <a href="/api/admin/peer/" target="_blank">设备管理</a>
    <a href="/api/admin/version/" target="_blank">版本管理</a>
    <a href="/api/admin/client_download/" target="_blank">下载管理</a>
    <a href="/downloads" target="_blank">用户下载页</a>
  </div>
</div>
<div id="toast" class="toast"></div>

<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h2>管理员登录</h2>
    <div class="form-group"><label>用户名</label><input id="loginUser" placeholder="admin"></div>
    <div class="form-group"><label>密码</label><input id="loginPass" type="password" placeholder="********"></div>
    <button class="btn btn-primary" onclick="login()" style="background:#2c8cff;color:#fff;border:none;border-radius:4px;cursor:pointer;">登 录</button>
  </div>
</div>

<div id="mainContent" class="container hidden">
  <div class="card">
    <div class="card-title">📈 设备统计</div>
    <div class="card-body">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card" onclick="location.href='/api/admin/peer/'"><div class="number total" id="totalPeers">-</div><div class="label">设备总数</div></div>
        <div class="stat-card clickable" onclick="location.href='/api/admin/peer/?status=online'" style="border-color:#52c41a;"><div class="number online" id="onlinePeers">-</div><div class="label">点击查看在线设备</div></div>
        <div class="stat-card clickable" onclick="location.href='/api/admin/peer/?status=offline'" style="border-color:#ff4d4f;"><div class="number offline" id="offlinePeers">-</div><div class="label">点击查看离线设备</div></div>
        <div class="stat-card"><div class="number info" id="todayConnections">-</div><div class="label">今日连接数</div></div>
        <div class="stat-card"><div class="number info" id="totalUsers">-</div><div class="label">用户总数</div></div>
      </div>
    </div>
  </div>
</div>

<script>
let token = '';

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast toast-' + type;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['api-token'] = token;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { token = ''; document.getElementById('loginOverlay').classList.remove('hidden'); return null; }
  const data = await res.json();
  if (data.code !== 0) { toast(data.message || '请求失败', 'error'); return null; }
  return data;
}

async function login() {
  const username = document.getElementById('loginUser').value;
  const password = document.getElementById('loginPass').value;
  const data = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ username, password }) });
  if (data && data.data && data.data.token) {
    token = data.data.token;
    localStorage.setItem('token', token);
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    toast('登录成功', 'success');
    loadStats();
  }
}

async function loadStats() {
  const data = await api('/api/admin/dashboard/stats');
  if (!data || !data.data) return;
  const s = data.data;
  document.getElementById('totalPeers').textContent = s.total_peers || 0;
  document.getElementById('onlinePeers').textContent = s.online_peers || 0;
  document.getElementById('offlinePeers').textContent = s.offline_peers || 0;
  document.getElementById('todayConnections').textContent = s.today_connections || 0;
  document.getElementById('totalUsers').textContent = s.total_users || 0;
}

(async function() {
  const savedToken = localStorage.getItem('token');
  if (savedToken) {
    token = savedToken;
    const d = await api('/api/admin/user/current');
    if (d && d.data) {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      loadStats();
      return;
    }
    token = '';
    localStorage.removeItem('token');
  }
  document.getElementById('loginOverlay').classList.remove('hidden');
})();
</script>
</body>
</html>
