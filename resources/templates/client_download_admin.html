<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户端下载管理 - RustDesk API</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
.header { background: #2c8cff; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
.header h1 { font-size: 20px; }
.header a { color: rgba(255,255,255,.8); text-decoration: none; font-size: 14px; }
.header a:hover { color: #fff; }
.container { max-width: 960px; margin: 0 auto; padding: 20px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 20px; }
.card-title { padding: 12px 16px; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 600; }
.card-body { padding: 16px; }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 180px; }
.form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
.btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
.btn-primary { background: #2c8cff; color: #fff; }
.btn-primary:hover { background: #1a7ae6; }
.btn-warning { background: #faad14; color: #fff; }
.btn-warning:hover { background: #d9910f; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e04345; }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-link { background: none; border: 1px solid #ddd; color: #333; cursor: pointer; padding: 4px 12px; font-size: 12px; border-radius: 4px; text-decoration: none; display: inline-block; }
.btn-link:hover { background: #f5f5f5; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
th { background: #fafafa; font-weight: 600; color: #666; }
tr:hover td { background: #f8f9ff; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
.badge-on { background: #e6f7e6; color: #52c41a; }
.badge-off { background: #fff0f0; color: #ff4d4f; }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 14px; z-index: 999; display: none; }
.toast-success { background: #52c41a; }
.toast-error { background: #ff4d4f; }
.login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.login-box { background: #fff; border-radius: 12px; padding: 32px; width: 360px; }
.login-box h2 { margin-bottom: 20px; font-size: 18px; text-align: center; }
.login-box .form-group { margin-bottom: 16px; min-width: 100%; }
.login-box .btn { width: 100%; padding: 10px; font-size: 15px; }
.hidden { display: none; }
.action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.empty { text-align: center; color: #999; padding: 40px; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
@media (max-width: 768px) {
  .header { padding: 12px 16px; flex-wrap: wrap; }
  .header h1 { font-size: 17px; }
  .container { padding: 10px; }
  .card-body { padding: 10px 8px; }
  .form-row { flex-direction: column; gap: 8px; }
  .form-group { min-width: 100%; }
  th, td { padding: 6px 8px; font-size: 12px; }
  .btn { min-height: 44px; padding: 10px 16px; font-size: 14px; }
  .btn-sm { min-height: 36px; padding: 6px 14px; font-size: 13px; }
  .login-box { width: 90vw; max-width: 360px; padding: 24px 20px; }
  .toast { left: 16px; right: 16px; top: 12px; text-align: center; }
  .badge { padding: 3px 8px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="header">
  <h1>📥 客户端下载管理</h1>
  <a href="/api/admin/version/" target="_blank">版本发布管理</a>
</div>
<div id="toast" class="toast"></div>

<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h2>管理员登录</h2>
    <div class="form-group"><label>用户名</label><input id="loginUser" placeholder="admin"></div>
    <div class="form-group"><label>密码</label><input id="loginPass" type="password" placeholder="********"></div>
    <button class="btn btn-primary" onclick="login()">登 录</button>
  </div>
</div>

<div id="mainContent" class="container hidden">
  <div class="card">
    <div class="card-title">添加下载链接</div>
    <div class="card-body">
      <div class="form-row">
        <div class="form-group"><label>平台 / 名称</label><input id="fName" placeholder="例如：Windows x64"></div>
        <div class="form-group"><label>平台标识</label>
          <select id="fPlatform">
            <option value="windows">Windows</option>
            <option value="macos">macOS</option>
            <option value="linux">Linux</option>
            <option value="ubuntu">Ubuntu</option>
            <option value="android">Android</option>
            <option value="ios">iOS</option>
            <option value="web">Web</option>
            <option value="other">其他</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>下载地址</label><input id="fUrl" placeholder="https://github.com/.../download"></div>
        <div class="form-group"><label>排序</label><input id="fSortOrder" type="number" value="0" placeholder="0"></div>
      </div>
      <button class="btn btn-primary" onclick="create()">添加链接</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">已配置的下载链接</div>
    <div class="card-body">
      <div class="table-wrap">
      <table id="dataTable">
        <thead><tr><th>ID</th><th>名称</th><th>平台</th><th>下载地址</th><th>排序</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="dataBody"></tbody>
      </table>
      </div>
      <div id="emptyTip" class="empty hidden">暂无下载链接</div>
    </div>
  </div>
</div>

<script>
let token = '';

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast toast-' + type;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['api-token'] = token;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { token = ''; document.getElementById('loginOverlay').classList.remove('hidden'); return null; }
  const data = await res.json();
  if (data.code !== 0) { toast(data.message || '请求失败', 'error'); return null; }
  return data;
}

async function login() {
  const username = document.getElementById('loginUser').value;
  const password = document.getElementById('loginPass').value;
  const data = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ username, password }) });
  if (data && data.data && data.data.token) {
    token = data.data.token;
    localStorage.setItem('token', token);
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    toast('登录成功', 'success');
    loadList();
  }
}

async function loadList() {
  const data = await api('/api/admin/client_download/list');
  if (!data || !data.data) return;
  const list = data.data.list || [];
  const tbody = document.getElementById('dataBody');
  const empty = document.getElementById('emptyTip');
  tbody.innerHTML = '';
  if (list.length === 0) { empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  list.forEach(v => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${v.id}</td>
      <td><strong>${esc(v.name)}</strong></td>
      <td>${esc(v.platform)}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(v.url)}">${esc(v.url)}</td>
      <td>${v.sort_order || 0}</td>
      <td><span class="badge ${v.status === 1 ? 'badge-on' : 'badge-off'}">${v.status === 1 ? '启用' : '禁用'}</span></td>
      <td>${v.created_at || ''}</td>
      <td>
        <button class="btn btn-sm ${v.status === 1 ? 'btn-warning' : 'btn-primary'}" onclick="toggle(${v.id}, ${v.status})">${v.status === 1 ? '禁用' : '启用'}</button>
        <button class="btn btn-sm btn-danger" onclick="del(${v.id})">删除</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function create() {
  const name = document.getElementById('fName').value.trim();
  const platform = document.getElementById('fPlatform').value;
  const url = document.getElementById('fUrl').value.trim();
  const sortOrder = parseInt(document.getElementById('fSortOrder').value) || 0;
  if (!name || !url) { toast('名称和下载地址不能为空', 'error'); return; }
  const data = await api('/api/admin/client_download/create', { method: 'POST', body: JSON.stringify({ name, platform, url, sort_order: sortOrder }) });
  if (data) { toast('添加成功', 'success'); document.getElementById('fName').value = ''; document.getElementById('fUrl').value = ''; loadList(); }
}

async function toggle(id, currentStatus) {
  const newStatus = currentStatus === 1 ? 2 : 1;
  const data = await api('/api/admin/client_download/setEnable', { method: 'POST', body: JSON.stringify({ id, status: newStatus }) });
  if (data) { toast('操作成功', 'success'); loadList(); }
}

async function del(id) {
  if (!confirm('确定删除此链接？')) return;
  const data = await api('/api/admin/client_download/delete', { method: 'POST', body: JSON.stringify({ id }) });
  if (data) { toast('删除成功', 'success'); loadList(); }
}

function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Auto login
(async function() {
  const savedToken = localStorage.getItem('token');
  if (savedToken) {
    token = savedToken;
    const d = await api('/api/admin/user/current');
    if (d && d.data) {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      loadList();
      return;
    }
    token = '';
    localStorage.removeItem('token');
  }
  // Show login by default
  document.getElementById('loginOverlay').classList.remove('hidden');
})();
</script>
</body>
</html>
